spring:
  application:
    name: trailgo-api

  datasource:
    url: jdbc:postgresql://localhost:5432/trailgo
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080